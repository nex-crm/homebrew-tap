name: commitlint

# Validates that every commit on a PR matches the conventional-commits
# format defined in .commitlintrc.json. Belt-and-suspenders for commits
# that bypass any local hook (e.g. via the GitHub UI or --no-verify).
#
# Inlined (rather than calling nex-crm/.github's reusable) because
# homebrew-tap is a public repo and cannot consume reusable workflows
# hosted in the private nex-crm/.github repo. Mirrors the same shape
# used in nex-crm/wuphf and other public repos in the org.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need history back to the merge base so commitlint can lint
          # every commit on the PR, not just the head.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"

      - name: Install commitlint
        run: bun install --frozen-lockfile

      - name: Lint commits
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            from="origin/${{ github.base_ref }}"
            to="HEAD"
          else
            # push to main: lint just the new commits in this push.
            from="${{ github.event.before }}"
            to="${{ github.sha }}"
            # Initial branch push has before=000…0; in that case lint
            # only the head commit so we don't trip on pre-policy history.
            if [ "$from" = "0000000000000000000000000000000000000000" ]; then
              from="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
          fi
          echo "linting $from..$to"
          bunx --bun commitlint --from "$from" --to "$to" --verbose
